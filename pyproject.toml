[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "hw_10_1"
version = "0.1.0"
description = "Банковский анализатор транзакций"
authors = ["dr.Alexander Vasilenko"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.4.0"
pandas = "^2.2.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
openpyxl = "^3.1.0"
pandas-stubs = "~=2.3.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"              # ← ДОБАВЛЕНО: основной инструмент типизации
types-requests = "^2.32.4"   # ← Заглушки для requests
pandas-stubs = "^2.1.0"      # ← Заглушки для pandas
flake8 = "^7.0.0"
isort = "^5.13.0"
black = "^23.0.0"

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.pytest_cache
  | \.mypy_cache
  | \.vscode
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip = [".git", "venv", ".venv", ".pytest_cache", ".mypy_cache", "__pycache__"]
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true      # ← ВАЖНО: для ошибки с аргументом по умолчанию
no_site_packages = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    '^venv/',
    '^\.venv/',
    '^\.pytest_cache/',
    '^\.mypy_cache/',
    '^\.virtualenvs/',
    '^tests/fixtures/',
    '^data/',
    '^logs/'
]

# Игнорируем отсутствие заглушек для сторонних библиотек (временно)
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "requests.*",
    "openpyxl.*",
    "dotenv.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload"
]