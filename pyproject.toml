[tool.poetry]
name = "hw_10_1"
version = "0.1.0"
description = "Банковский анализатор транзакций"
authors = ["dr.Alexander Vasilenko"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
pandas = "^2.1.0"
openpyxl = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
types-requests = "^2.32.4"
flake8 = "^7.0.0"
isort = "^5.13.0"
pandas-stubs = "^2.1.0"
black = "^23.0.0"

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip = [".git", "venv", ".venv", ".pytest_cache"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv", ".venv", ".pytest_cache"]